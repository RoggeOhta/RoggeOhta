name: GitHub Metrics

on:
  schedule:
    # Refresh daily at 02:15 UTC
    - cron: "15 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: true

jobs:
  metrics:
    name: Generate lowlighter/metrics Infographic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate native GitHub metrics SVG
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          use_prebuilt_image: yes
          config_display: large
          config_octicon: yes
          config_twemoji: yes
          config_padding: 0, 8%
          base: header, activity, community, repositories
          base_indepth: no
          # 3D Isometric Voxel/Mosaic Contribution Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          # Most Used Languages (excluding legacy static site & markup)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_skipped: roggeohta.github.io
          plugin_languages_ignored: html, css, dockerfile, makefile
          plugin_languages_limit: 6
          # Concise coding habits summary
          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_facts: yes
          plugin_habits_charts: no
          committer_message: "chore: update github metrics"
