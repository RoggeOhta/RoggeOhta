name: GitHub Metrics

on:
  schedule:
    # Refresh daily at 02:15 UTC
    - cron: "15 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: true

jobs:
  metrics:
    name: Generate lowlighter/metrics Infographic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate native GitHub metrics SVG
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          use_prebuilt_image: yes
          config_display: large
          config_octicon: yes
          config_twemoji: yes
          config_padding: 0, 6%
          # Clean public activity + 3D isometric contribution calendar (zero PAT required, zero follower/star clutter)
          base: activity
          base_indepth: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          committer_message: "chore: update github metrics"
